name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-2022
            qt-host: windows
            qt-arch: win64_msvc2022_64
          - name: macOS
            os: macos-latest
            qt-host: mac
            qt-arch: clang_64
          - name: Ubuntu
            os: ubuntu-latest
            qt-host: linux
            qt-arch: gcc_64

    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.2'
          host: ${{ matrix.qt-host }}
          target: desktop
          arch: ${{ matrix.qt-arch }}
      - name: Configure
        run: cmake -S . -B build
      - name: Build
        run: cmake --build build --config Release
